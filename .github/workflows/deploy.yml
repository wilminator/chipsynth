name: Deploy

# Builds a release tag and uploads it to PyPI by trusted publishing (OIDC: no token or password is stored anywhere).
# The upload job waits for the `release` environment: the author creates that environment on GitHub and adds
# himself as a required reviewer, so every upload needs a hand-click on "Approve and deploy".
# Called by ci-cd.yml; it is not meant to be started on its own (PyPI trusts ci-cd.yml, see RELEASING.md).
on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build and upload (the tag is the version, so 0.2.0 and not v0.2.0)."
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.tag }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag }}
      artifact-name: dist-release
      expected-version: ${{ inputs.tag }}

  publish:
    name: Upload ${{ inputs.tag }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The approval gate. Nothing below runs until a reviewer of the `release` environment approves.
    environment:
      name: release
      url: https://pypi.org/project/chipsynth/${{ inputs.tag }}/

    permissions:
      id-token: write   # IMPORTANT: mandatory for trusted publishing
      contents: read

    steps:
      - name: Get the built files
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist-release
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
